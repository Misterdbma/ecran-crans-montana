<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crans-Montana">
<meta name="theme-color" content="#0e151d">
<title>Crans-Montana</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>html,body{margin:0;padding:0;background:#0e151d}[hidden]{display:none!important}</style>
<style>
/* Layout: écran d'ardoise de chalet, horloge et météo à gauche, agenda à droite. Thème sombre unique (écran allumé en permanence). */
:root{
  --bg:#0e151d; --panel:#16212d; --line:#243344;
  --fg:#e9eef2; --muted:#8c9cad; --snow:#ffffff;
  --larch:#d8a347; --larch-soft:rgba(216,163,71,.14);
  --sky:#7fb4d6; --ok:#7cc29a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-gap:18px;max-width:1280px;margin:0 auto}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;grid-gap:18px;align-content:start;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.top{display:grid;grid-template-columns:1fr auto;align-items:start;grid-gap:10px}
.lang{display:grid;grid-template-columns:auto auto auto;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);font:600 12px var(--body);letter-spacing:.08em;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--larch);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(72px,13vw,132px);line-height:.9;letter-spacing:.01em;color:var(--snow);font-variant-numeric:tabular-nums}
.date{font-family:var(--display);font-weight:500;font-size:26px;color:var(--larch);text-transform:capitalize;margin-top:6px}
.place{color:var(--muted);font-size:13px;margin-top:2px}
.now{display:grid;grid-template-columns:auto 1fr;grid-gap:14px;align-items:center}
.now svg{width:64px;height:64px}
.now .t{font-family:var(--display);font-weight:700;font-size:48px;line-height:1}
.now .d{color:var(--muted);font-size:14px}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.day{text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;color:var(--fg);font-weight:600;text-transform:capitalize}
.day svg{width:30px;height:30px;display:block;margin:4px auto}
.day .mx{color:var(--fg);font-variant-numeric:tabular-nums}
.cd{display:grid;grid-gap:10px}
.cdrow{display:grid;grid-template-columns:auto 1fr;grid-gap:12px;align-items:baseline}
.cdn{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;color:var(--larch);min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.cdl{font-size:14px}
.cdl small{display:block;color:var(--muted);font-size:12px}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0 0 12px;letter-spacing:.01em;text-wrap:balance}
.ev{display:grid;grid-template-columns:4px 1fr;grid-gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-of-type{border-top:0}
.ev .bar{border-radius:2px;background:var(--line)}
.ev.event .bar{background:var(--larch)}
.ev.offer .bar{background:var(--sky)}
.ev.outdoor .bar{background:var(--ok)}
.ev h3{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.ev p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tag.gold{background:var(--larch-soft);color:var(--larch)}
.ev.exp .bar{background:linear-gradient(180deg,#f2d38a,var(--larch))}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(127,180,214,.14);color:var(--sky);margin-left:6px;vertical-align:2px}
.dayhead{font-family:var(--display);font-weight:700;font-size:18px;color:var(--larch);text-transform:capitalize;margin:14px 0 2px}
.dayhead:first-child{margin-top:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.legend{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;grid-gap:4px 16px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.foot{grid-column:1/-1;color:var(--muted);font-size:12px;text-align:center}
.stale{color:var(--larch)}
/* Golf et remontées */
.mtn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:10px;padding:10px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.015);color:var(--fg);text-align:left;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tile:active{background:rgba(255,255,255,.05)}
.tile::after{content:"\203A";font-size:22px;line-height:1;color:var(--muted)}
.tile svg{width:30px;height:30px;color:var(--larch)}
.tile b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .st{display:grid;grid-template-columns:auto minmax(0,1fr);grid-gap:7px;align-items:center;font-size:15px;font-weight:600;margin-top:2px}
.tile .st span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .st i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tile.open .st i{background:var(--ok);box-shadow:0 0 0 3px rgba(124,194,154,.18)}
.tile.closed .st i{background:var(--larch);box-shadow:0 0 0 3px var(--larch-soft)}
.tile.partial .st i{background:var(--sky)}
.tile.warn .st i{background:var(--larch);box-shadow:0 0 0 3px var(--larch-soft)}
.tile.alert .st i{background:#e0795b;box-shadow:0 0 0 3px rgba(224,121,91,.2)}
.sheet .wxroad{margin:0 0 16px;display:grid;grid-gap:8px}
.sheet .wxroad .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.sheet .wxroad .r{display:grid;grid-template-columns:auto 7.5em minmax(0,1fr);grid-gap:10px;align-items:baseline;font-size:15px}
.sheet .wxroad .r i{width:9px;height:9px;border-radius:50%;background:var(--ok);align-self:center}
.sheet .wxroad .r.l1 i{background:var(--larch)}
.sheet .wxroad .r.l2 i{background:#e0795b}
.sheet .wxroad .r b{font-weight:600;color:var(--snow)}
.tile:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.sheet .rows{display:grid;grid-template-columns:1fr auto;grid-gap:0 16px;margin:0 0 16px;border-top:1px solid var(--line)}
.sheet .rows dt,.sheet .rows dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.sheet .rows dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--snow)}
.sheet .prog{margin:0 0 14px}
.sheet .prog h4{font-family:var(--display);font-weight:700;font-size:18px;color:var(--larch);text-transform:capitalize;margin:10px 0 4px}
.sheet .prog .row{display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;grid-gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.sheet .prog .row b{font-variant-numeric:tabular-nums;color:var(--snow)}
.sheet .prog .row small{color:var(--muted);font-size:12px}
.sheet .price{margin:0 0 16px;font-size:14px;color:var(--fg);background:var(--larch-soft);border-radius:8px;padding:8px 12px}
/* Aujourd'hui en version compacte */
.p-today .ev{padding:6px 0;grid-gap:10px}
.p-today .ev h3{font-size:14px}
.p-today .ev p{font-size:12px}
.p-today .ev .more{font-size:18px}
.subhead{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--larch);margin:12px 0 2px;padding-top:10px;border-top:1px dashed var(--line)}
.subhead+.ev{border-top:0}
/* Conciergerie */
.cgwrap{display:grid;grid-template-columns:minmax(0,1fr) 200px;grid-gap:18px;align-items:start}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:10px}
.svc-b{display:grid;grid-gap:4px;align-content:start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);color:var(--fg);font:inherit;cursor:pointer;min-height:84px;-webkit-tap-highlight-color:transparent;transition:border-color .2s,background .2s}
.svc-b b{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.1;color:var(--snow)}
.svc-b small{font-size:12px;color:var(--muted);line-height:1.3}
.svc-b.on{border-color:var(--larch);background:var(--larch-soft)}
.svc-b.on b{color:var(--larch)}
.svc-b:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.cgqr{display:grid;justify-items:center;text-align:center;grid-gap:8px;padding:14px;border:1px solid rgba(216,163,71,.45);border-radius:14px;background:linear-gradient(160deg,rgba(216,163,71,.12),rgba(216,163,71,.02))}
.cgqr .qr{width:150px;padding:8px}
.cgqr p{margin:0;font-size:13px;line-height:1.35}
.cgqr p b{color:var(--larch)}
.cgqr .hrs{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.cgwrap{grid-template-columns:minmax(0,1fr)}.svc{grid-template-columns:repeat(2,minmax(0,1fr))}}
.concierge{padding:10px;background:linear-gradient(135deg,rgba(216,163,71,.10),rgba(216,163,71,.02)) var(--panel);border-color:rgba(216,163,71,.35)}
.concierge{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto auto;grid-gap:6px 8px}
.concierge #cg-btn{grid-row:1/3}
.concierge .wc-btn{min-height:0;padding:7px 10px}
.concierge .wc-btn small{display:none}
.concierge .wc-btn svg{width:22px;height:22px}
.concierge .cg-btn.wc-btn b{font-size:13px;letter-spacing:.12em}
.rests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:10px;margin:6px 0 0}
.rest{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-gap:4px 12px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.rest .qr{width:70px;padding:4px;grid-row:1/5;grid-column:2}
.rest b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--snow)}
.rest .aw{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--larch)}
.rest p{margin:0;font-size:13px;color:var(--fg);line-height:1.35}
.rest .hr{color:var(--muted);font-size:12px}
.rest .tl{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--snow)}
@media (max-width:640px){.rests{grid-template-columns:minmax(0,1fr)}}
.wc-btn b{font-size:18px;letter-spacing:.16em}
.wc-btn small{letter-spacing:.04em}
.wc-btn{grid-gap:10px;padding:12px 12px;grid-template-columns:auto 1fr}
.cg-btn.wc-btn::after{content:none}
.wc-btn svg{width:30px;height:30px}
.sheet.wide{max-width:980px}
.cams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:12px;margin:6px 0 0}
.cam{margin:0;display:grid;grid-template-rows:auto auto 1fr auto;justify-items:center;text-align:center;grid-gap:6px;padding:16px 12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.cam .ct{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--larch)}
.cam b{font-weight:600;font-size:15px;line-height:1.25;color:var(--snow);align-self:start;min-height:2.5em}
.cam .qr{width:100%;max-width:150px;padding:8px;margin-top:4px}
.cam small{color:var(--muted);font-size:10px;line-height:1.3}
@media (max-width:640px){.cams{grid-template-columns:repeat(2,minmax(0,1fr))}}
.live{display:inline-grid;grid-template-columns:auto auto;grid-gap:6px;align-items:center;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#e0795b;font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:#e0795b;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cg-btn{width:100%;height:100%;min-height:58px;display:grid;grid-template-columns:auto 1fr auto;grid-gap:14px;align-items:center;text-align:left;padding:12px 16px;border:1px solid rgba(216,163,71,.55);border-radius:10px;background:transparent;color:var(--larch);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s}
.cg-btn::after{content:"\203A";font-size:26px;line-height:1;color:var(--larch)}
.cg-btn:active{background:var(--larch-soft)}
.cg-btn svg{width:34px;height:34px}
.cg-btn b{display:block;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:var(--snow);line-height:1.1}
.cg-btn small{display:block;font-size:12px;letter-spacing:.08em;color:var(--larch);margin-top:3px}
.cg-btn:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.sheet .services{margin:0 0 16px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:8px 16px}
.sheet .services li{font-size:15px;padding-left:16px;position:relative}
.sheet .services li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--larch)}
/* Fiche détaillée d'une activité */
.ev{cursor:pointer;grid-template-columns:4px 1fr auto;-webkit-tap-highlight-color:transparent;border-radius:6px;transition:background .15s}
.ev:active{background:rgba(255,255,255,.04)}
.ev .more{align-self:center;color:var(--muted);font-size:22px;line-height:1;padding-right:2px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;background:rgba(6,10,14,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .18s ease-out}
.modal[hidden]{display:none}
.sheet{position:relative;box-sizing:border-box;width:100%;max-width:620px;max-height:calc(100dvh - 48px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:rise .22s ease-out}
.sheet .kind{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;grid-gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 40px 10px 0}
.sheet .kind i{width:10px;height:10px;border-radius:2px;background:var(--line)}
.sheet .kind.event i{background:var(--larch)} .sheet .kind.offer i{background:var(--sky)} .sheet .kind.outdoor i{background:var(--ok)}
.sheet h2{font-size:34px;margin:0 40px 6px 0}
.sheet .when{font-family:var(--display);font-weight:500;font-size:20px;color:var(--larch);margin:0 0 4px}
.sheet .detail{color:var(--muted);margin:0 0 14px}
.sheet .desc{margin:0 0 16px;font-size:16px}
.sheet .warn{margin:0 0 16px;font-size:13px;color:var(--sky)}
.contact{display:grid;grid-template-columns:1fr auto;grid-gap:18px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.contact .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.contact .line{font-size:16px;margin:2px 0;word-break:break-word}
.contact .line b{font-weight:600;font-variant-numeric:tabular-nums}
.qr{background:#fff;border-radius:10px;padding:8px;width:116px}
.qr svg{display:block;width:100%;height:auto}
.qr small{display:block;text-align:center;color:#3a4654;font-size:10px;line-height:1.2;margin-top:4px}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.close{display:block;width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:var(--larch);color:var(--bg);font:700 15px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.x:focus-visible,.close:focus-visible,.ev:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@media (max-width:520px){.contact{grid-template-columns:1fr}.qr{display:none}.sheet h2{font-size:28px}}
@media (prefers-reduced-motion:reduce){.modal,.sheet{animation:none}}
.status{display:inline-grid;grid-template-columns:auto auto;grid-gap:7px;align-items:center;margin-top:10px;padding:4px 11px 4px 9px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--ok);box-shadow:0 0 0 3px rgba(124,194,154,.18)}
.status.ok{color:var(--ok)}
.status.ko i{background:var(--larch);box-shadow:0 0 0 3px var(--larch-soft)}
.status.ko{color:var(--larch)}
/* Mode écran fixe (tablette, paysage ou portrait) : tout tient dans l'écran, les listes longues défilent seules */
@media (min-width:761px){
  html,body{height:100%;overflow:hidden}
  .wrap{height:100vh;height:100dvh;box-sizing:border-box;grid-template-rows:minmax(0,1fr) auto;padding-block:14px;grid-gap:14px}
  .col{min-height:0;grid-gap:14px}
  .col-r{grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);align-content:stretch}
  .col-l{display:flex;flex-direction:column;gap:14px}
  .col-l>.panel{flex:0 0 auto}
  .col-l>.p-today{flex:1 1 auto;min-height:0}
  .col-l>.concierge{margin-top:auto}
  .panel{padding:14px 18px}
  .fit{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
  .scroll{overflow:hidden;touch-action:none;min-height:0;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}
  .p-today{grid-template-rows:auto minmax(0,1fr)}
  .clock{font-size:clamp(56px,min(12vw,12vh),120px)}
  .date{font-size:22px;margin-top:4px}
  .col-l>.panel:first-child{position:relative}
  .status{position:absolute;right:18px;bottom:14px;margin:0}
  /* Compte à rebours sur une ligne, en haut à droite */
  .p-cd{padding:12px 18px}
  .cd{grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:14px}
  .cdrow{grid-template-columns:minmax(0,1fr);grid-gap:2px}
  .cdn{text-align:left;font-size:32px}
  .cdl{font-size:13px;line-height:1.3}
  /* Météo sur une ligne */
  .wx{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;grid-gap:0 16px;align-items:center}
  .wx .eyebrow{grid-column:1/-1}
  .wx .now{grid-template-columns:auto auto;grid-gap:8px}
  .wx .now .d{max-width:9em;font-size:12px;line-height:1.3}
  .days{margin-top:0;padding-top:0;border-top:0;border-left:1px solid var(--line);padding-left:12px;grid-gap:2px}
  .day{font-size:11px}
  .day svg{width:22px;height:22px;margin:2px auto}
  .now svg{width:44px;height:44px}
  .now .t{font-size:38px}
  /* Remontées, golf, route : une ligne chacun */
  .mtn{grid-template-columns:minmax(0,1fr);grid-gap:6px;padding:8px}
  .tile{padding:8px 12px;grid-gap:10px}
  .tile svg{width:24px;height:24px}
  .tile b{letter-spacing:.1em}
  .tile>span{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;grid-gap:10px}
  .tile .st{grid-template-columns:auto auto;justify-content:end;margin-top:0;font-size:14px}
  .cg-btn{padding:9px 14px}
  .cg-btn b{font-size:20px}
  .concierge{padding:8px}
  .cg-btn{grid-gap:10px;padding:10px 12px}
  .cg-btn svg{width:28px;height:28px}
  .cg-btn b{font-size:17px;letter-spacing:.14em}
  .cg-btn.wc-btn b{font-size:15px;letter-spacing:.1em}
}
@media (min-width:761px) and (min-aspect-ratio:1/1) and (max-height:800px){
  .wrap,.col{grid-gap:10px}
  .col-l{gap:10px}
  .wrap{padding-block:10px}
  .panel{padding:11px 16px}
  .eyebrow{margin-bottom:6px}
  .date{font-size:20px}
  .cdn{font-size:28px}
  .mtn{padding:6px}
  .tile{padding:6px 12px}
  .cg-btn{grid-template-columns:auto 1fr}
  .cg-btn::after{content:none}
  .cg-btn b{font-size:16px;letter-spacing:.12em}
  .concierge{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
  .concierge .cg-btn.wc-btn b{font-size:12px;letter-spacing:.06em}
  .concierge .wc-btn{grid-gap:7px;padding:7px 8px}
}
@media (min-width:761px) and (max-aspect-ratio:1/1){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .col-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .col-l>.panel:first-child{order:1}
  .col-l>.mtn{order:2}
  .col-l>.wx{order:3;display:block}
  .col-l>.p-today{order:4}
  .col-l>.concierge{order:5;grid-column:1/-1;margin-top:0}
  .sc-today{max-height:19vh}
  .wx .now{grid-template-columns:auto 1fr}
  .wx .now .d{max-width:none}
  .days{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
  .clock{font-size:clamp(56px,11vw,120px)}
  .tile>span{display:block}
  .tile .st{justify-content:start;margin-top:2px}
}

.brand-logo{display:block;max-height:34px;max-width:180px;margin:0 0 6px}
.cam .ph{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0b1118;border:1px solid var(--line);margin-top:4px}
.cam .ph img{display:block;width:100%;height:100%;object-fit:cover}
.cam .ph+.qr{max-width:96px}
.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;color:#8c9cad;font:15px -apple-system,sans-serif;background:#0e151d;padding:24px;text-align:center}
.enroll{display:grid;grid-gap:14px;justify-items:center;max-width:420px}
.enroll h1{font-family:var(--display);font-weight:700;font-size:34px;color:#fff;margin:0}
.enroll p{margin:0;line-height:1.5}
.enroll input{font:600 26px var(--body);letter-spacing:.12em;text-transform:uppercase;text-align:center;width:260px;padding:12px;border-radius:12px;border:1px solid #243344;background:#16212d;color:#fff}
.enroll button{font:700 15px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:13px 28px;border:0;border-radius:12px;background:#d8a347;color:#0e151d;cursor:pointer}
.enroll .err{color:#e0795b;min-height:1.2em}

  var SC=document.querySelectorAll(".scroll"), scState=[], HAND=15000;

    (function(s){
      var el=s.el, y0=0, top0=0, lastY=0, lastT=0, v=0, moved=0, raf=0;

        v=0.8*((lastY-t.clientY)/dt)+0.2*v; lastY=t.clientY; lastT=now; moved=Math.max(moved,Math.abs(t.clientY-y0));
        setTop(top0+(y0-t.clientY)); s.userUntil=now+HAND; },{passive:true});
      el.addEventListener("touchend",function(){ s.userUntil=Date.now()+HAND;
        if(Date.now()-lastT>80) v=0;
        (function glide(){ if(Math.abs(v)<0.02) return; setTop(el.scrollTop+v*16); v*=0.95; s.userUntil=Date.now()+HAND; raf=requestAnimationFrame(glide); })(); },{passive:true});
      el.addEventListener("wheel",function(e){ setTop(el.scrollTop+e.deltaY); s.userUntil=Date.now()+HAND; },{passive:true});
      el.addEventListener("click",function(e){ if(moved>8){ e.stopPropagation(); e.preventDefault(); moved=0; } },true); /* un glissement n'ouvre pas de fiche */
      scState.push(s);
    })({el:SC[i],wait:120,pos:0,userUntil:0});
  }
  setInterval(function(){
    if(!modal.hidden) return;
    for(var j=0;j<scState.length;j++){
      var s=scState[j], el=s.el, max=el.scrollHeight-el.clientHeight;
      if(Date.now()<s.userUntil){ s.wait=30; continue; } /* le locataire a la main */
      if(max<=2){ if(s.pos){s.pos=0;el.scrollTop=0;} continue; }
      if(s.wait>0){ s.wait--; continue; }
      if(s.pos>=max){ s.pos=0; el.scrollTop=0; s.wait=120; continue; }
      s.pos=Math.min(max,s.pos+0.6); el.scrollTop=s.pos;
      if(s.pos>=max) s.wait=100;
    }
  },33);

  /* Rechargement automatique chaque jour à 5h pour récupérer les nouvelles données */
  function reloadPage(){
    if(navigator.onLine===false) return; /* hors ligne : nouvel essai 10 min plus tard */
    try{ window.top.location.reload(); }catch(e){ location.reload(); }
  }
  var n0=new Date(), reloadAt=new Date(n0.getFullYear(),n0.getMonth(),n0.getDate(),5,0,0);
  if(reloadAt<=n0) reloadAt.setDate(reloadAt.getDate()+1);
  setInterval(function(){ if(new Date()>=reloadAt){ reloadAt=new Date(Date.now()+600000); reloadPage(); } },30000);

  var lastDay=iso(new Date());
  setInterval(function(){
    renderClock();
    var d=iso(new Date()); if(d!==lastDay){lastDay=d; renderAll();}
  },15000);

  try{ if(navigator.wakeLock && navigator.wakeLock.request){ navigator.wakeLock.request("screen").catch(function(){}); } }catch(err){}
}

/* Démarrage
   1. code d'installation de l'écran (ex. CM-0001), saisi une fois puis mémorisé
   2. devices/<CODE>.json : réglages de cet écran (agence, logement, conciergerie, station)
   3. resorts/<station>.json : contenu local mis à jour chaque matin
   Tout est mis en cache : l'écran reste affiché si le réseau coupe. */
(function(){
  var KEY="cm-code", bootEl=document.getElementById("boot");
  function getJSON(u){ return fetch(u+"?t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw r.status; return r.json(); }); }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
  function norm(c){ return String(c||"").toUpperCase().replace(/[^A-Z0-9-]/g,""); }
  function start(code,dev,data){
    window.SCREEN_CODE=code; window.CONFIG=dev; window.CONCIERGE=dev.concierge||{}; window.DATA=data;
    if(bootEl&&bootEl.parentNode) bootEl.parentNode.removeChild(bootEl);
    startApp();
    /* Bouton caché : 5 touchers rapides sur la ligne du lieu pour changer le code de l'écran */
    var taps=0,tt=0; document.querySelector(".place").addEventListener("click",function(){ taps=(Date.now()-tt<600)?taps+1:1; tt=Date.now();
      if(taps>=5 && confirm("Changer le code d'installation de cet écran ?")){ localStorage.removeItem(KEY); location.reload(); } });
  }
  function fetchAll(code){
    return getJSON("devices/"+code+".json").then(function(dev){
      return getJSON("resorts/"+(dev.resort||"crans-montana")+".json").then(function(data){ return [dev,data]; });
    });
  }
  function enroll(msg){
    bootEl.innerHTML='<form class="enroll"><h1>Bienvenue</h1><p>Saisissez le code d\'installation de cet écran.<br><small>Enter the screen code · Bildschirmcode eingeben</small></p>'+
      '<input id="code" autocomplete="off" autocapitalize="characters" placeholder="CM-0000"><button type="submit">Valider</button><p class="err" id="err">'+(msg||"")+'</p></form>';
    var f=bootEl.querySelector("form"); f.onsubmit=function(ev){ ev.preventDefault();
      var code=norm(document.getElementById("code").value); if(!code) return;
      document.getElementById("err").textContent="Vérification…";
      fetchAll(code).then(function(r){ localStorage.setItem(KEY,code); save("cm-dev",r[0]); save("cm-data",r[1]); start(code,r[0],r[1]); })
        .catch(function(st){ document.getElementById("err").textContent= st===404?"Code inconnu. Vérifiez-le auprès de votre agence.":"Connexion impossible, réessayez."; });
    };
  }
  var q=norm((location.search.match(/[?&]code=([^&]+)/)||[])[1]); if(q) localStorage.setItem(KEY,q);
  var code=localStorage.getItem(KEY);
  if(!code){ enroll(); }
  else{
    fetchAll(code).then(function(r){ save("cm-dev",r[0]); save("cm-data",r[1]); start(code,r[0],r[1]); })
      .catch(function(st){
        var dev=load("cm-dev"), data=load("cm-data");
        if(st===404 && !dev){ localStorage.removeItem(KEY); enroll("Code inconnu."); return; }
        if(dev&&data) start(code,dev,data);
        else { bootEl.textContent="Connexion indisponible. Nouvel essai dans une minute."; setTimeout(function(){ location.reload(); },60000); }
      });
    /* Toutes les 30 min : nouveaux réglages ou nouveau contenu publiés => l'écran se recharge */
    setInterval(function(){
      fetchAll(code).then(function(r){
        var a=JSON.stringify(r[0]), b=JSON.stringify(r[1]);
        if(a!==JSON.stringify(load("cm-dev"))||b!==JSON.stringify(load("cm-data"))){ save("cm-dev",r[0]); save("cm-data",r[1]); location.reload(); }
      }).catch(function(){});
    },1800000);
  }
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
</script>
